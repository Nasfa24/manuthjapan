<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | MANUTH JAPAN</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
    <link rel="apple-touch-icon" href="favicon-512.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --deep-indigo: #0A2540; --sakura-pink: #FF8DA1; 
            --clean-slate: #FFFFFF; --soft-ice-blue: #E0F7FA;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--soft-ice-blue); color: var(--deep-indigo); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; overflow: hidden; }
        
        .error-code { font-size: clamp(100px, 15vw, 180px); font-weight: 900; color: var(--sakura-pink); line-height: 1; text-shadow: 0 10px 30px rgba(255, 141, 161, 0.3); margin-bottom: 10px; }
        .error-title { font-size: clamp(24px, 4vw, 36px); font-weight: 800; margin-bottom: 20px; }
        .error-desc { font-size: 16px; font-weight: 500; opacity: 0.8; max-width: 500px; margin-bottom: 40px; line-height: 1.6; }
        
        .btn-cta { background-color: var(--deep-indigo); color: var(--clean-slate); padding: 15px 35px; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; box-shadow: 0 10px 25px rgba(10, 37, 64, 0.2); transition: transform 0.3s, box-shadow 0.3s; }
        .btn-cta:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(10, 37, 64, 0.3); }
        
        /* Animasi Ornamen */
        .circle-bg { position: absolute; border-radius: 50%; border: 2px dashed var(--sakura-pink); opacity: 0.2; z-index: -1; animation: spin 40s linear infinite; }
        .c1 { width: 300px; height: 300px; }
        .c2 { width: 500px; height: 500px; animation-direction: reverse; }
        .c3 { width: 700px; height: 700px; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="circle-bg c1"></div>
    <div class="circle-bg c2"></div>
    <div class="circle-bg c3"></div>

    <img src="logo 1.png" alt="MANUTH JAPAN" style="max-height: 60px; margin-bottom: 40px; z-index: 10;">
    
    <div class="error-code">404</div>
    <div class="error-title">Oops! Anda Keluar Jalur</div>
    <div class="error-desc">Halaman yang Anda cari mungkin telah dipindahkan, dihapus, atau Anda salah memasukkan alamat. Mari kembali ke jalur keberangkatan yang benar.</div>
    
    <a href="https://manuthjapan.com/" class="btn-cta">Kembali ke Beranda Utama</a>

</body>
</html>
